kind = "web"
previewPath = "/"
title = "Sea of Thieves Treasure Guide"
version = "1.0.0"
id = "artifacts/sot-treasure"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20013

[services.development]
run = "pnpm --filter @workspace/sot-treasure run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sot-treasure", "run", "build" ]
publicDir = "artifacts/sot-treasure/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20013"
BASE_PATH = "/"
